name: Bicep Validation and What-If

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '**.bicep'
      - '**.parameters.json'
      - '.github/workflows/**'

env:
  AZURE_RESOURCE_GROUP: rg-smb-landingzone-dev-eastus
  LOCATION: eastus

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bicep
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Run Bicep Linter
        run: bicep build main.bicep

  # Note: The What-If job requires Azure Credentials.
  # To enable this, configure the AZURE_CREDENTIALS secret in your GitHub repository.
  what-if:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # - name: Azure Login
      #   uses: azure/login@v1
